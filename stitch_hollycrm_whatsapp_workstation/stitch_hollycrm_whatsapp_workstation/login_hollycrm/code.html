<style>
        .input-glow:focus {
            box-shadow: 0 0 0 2px rgba(195, 192, 255, 0.5); /* light violet glow */
        }
    </style>

<body class="h-full bg-background flex items-center justify-center font-body-base text-on-surface">
<main class="w-full max-w-md px-margin-mobile md:px-0">
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_6px_-1px_rgba(15,23,42,0.1)] border border-outline-variant/30 p-xl w-full">
<!-- Logo & Header -->
<div class="text-center mb-xl">
<div class="w-16 h-16 bg-inverse-surface rounded-full flex items-center justify-center mx-auto mb-gutter text-secondary-fixed font-h1 text-h1 font-black">
                    H
                </div>
<h1 class="text-h1 font-h1 text-on-surface">Welcome back</h1>
<p class="text-body-medium font-body-medium text-on-surface-variant mt-xs">Log in to HollyCRM Enterprise</p>
</div>
<!-- Form -->
<form action="#" class="space-y-gutter" method="POST">
<!-- Email -->
<div>
<label class="block text-metadata-bold font-metadata-bold text-on-surface mb-sm" for="email">Email address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glow transition-all duration-200 text-body-base font-body-base" id="email" name="email" placeholder="you@company.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block text-metadata-bold font-metadata-bold text-on-surface" for="password">Password</label>
<a class="text-metadata font-metadata text-primary hover:text-on-primary-fixed-variant transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-outline-variant rounded bg-surface-container-lowest text-on-surface placeholder-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glow transition-all duration-200 text-body-base font-body-base" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded bg-surface-container-lowest cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-body-medium font-body-medium text-on-surface-variant cursor-pointer" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<!-- Submit Button -->
<div class="pt-sm">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded bg-primary-container text-on-primary text-body-medium font-body-medium hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary shadow-sm" type="submit">
                        Login
                    </button>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="text-metadata font-metadata text-on-surface-variant">
                Need help? <a class="font-metadata-bold text-primary hover:underline" href="#">Contact Support</a>
</p>
</div>
</main>
</body></html>
